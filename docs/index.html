<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Command Center</title>
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Command Center">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  :root { --bg:#0b0f14; --panel:#121821; --line:#1f2a36; --text:#d7e1ea; --dim:#7d8b99; --acc:#3fb6ff; --ok:#3ddc84; --bad:#ff5c5c; --warn:#ffb347; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif; }
  header { position:sticky; top:0; z-index:5; background:rgba(11,15,20,.95); backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
           padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 14px) 0 calc(env(safe-area-inset-left) + 14px); }
  .top { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  h1 { margin:0; font-size:13px; letter-spacing:.14em; color:var(--acc); }
  #upd { font-size:11px; color:var(--dim); text-align:right; }
  nav { display:flex; gap:4px; margin-top:8px; overflow-x:auto; scrollbar-width:none; }
  nav button { flex:0 0 auto; background:none; border:0; color:var(--dim); font:inherit; font-size:14px; padding:8px 12px; border-bottom:2px solid transparent; cursor:pointer; }
  nav button.on { color:var(--text); border-bottom-color:var(--acc); }
  main { padding:12px calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 30px) calc(env(safe-area-inset-left) + 14px); max-width:900px; margin:0 auto; }
  .view { display:none; } .view.on { display:block; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:12px; }
  .card h3 { margin:0 0 8px; font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; font-weight:600; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:8px; }
  .tile { background:#0e141c; border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
  .tile .n { font-size:11px; color:var(--dim); } .tile .v { font-size:17px; font-weight:600; } .tile .c { font-size:12px; }
  .up { color:var(--ok); } .down { color:var(--bad); } .flag { color:var(--warn); font-weight:700; font-size:11px; }
  .row { display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .row .t { font-weight:600; } .row .s { font-size:12px; color:var(--dim); margin-top:2px; }
  .row .r { text-align:right; font-size:13px; white-space:nowrap; }
  a.item { display:block; color:var(--text); text-decoration:none; padding:9px 0; border-bottom:1px solid var(--line); }
  a.item:last-child { border-bottom:0; } a.item small { display:block; color:var(--dim); font-size:12px; margin-top:2px; }
  .muted { color:var(--dim); font-size:12px; }
  .topic { cursor:pointer; }
  .heads { display:none; padding:2px 0 6px 10px; border-left:2px solid var(--line); margin:4px 0 6px; } .heads.open { display:block; }
  .cta { display:block; text-align:center; background:#13263a; border:1px solid #23405f; color:var(--acc); text-decoration:none; padding:12px; border-radius:12px; margin-bottom:12px; font-weight:600; }
  svg { vertical-align:middle; }
</style>
</head>
<body>
<header>
  <div class="top"><h1>COMMAND CENTER</h1><div id="upd">Loading…</div></div>
  <nav>
    <button data-v="overview" class="on">Overview</button>
    <button data-v="radar">Spike Radar</button>
    <button data-v="world">World News</button>
    <button data-v="markets">Markets</button>
    <button data-v="earth">Earth</button>
  </nav>
</header>
<main>
  <section class="view on" id="v-overview"></section>
  <section class="view" id="v-radar"></section>
  <section class="view" id="v-world"></section>
  <section class="view" id="v-markets"></section>
  <section class="view" id="v-earth"></section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const ago = iso => { if (!iso) return ''; const m = Math.round((Date.now() - new Date(iso)) / 60000); return m < 1 ? 'just now' : m < 60 ? `${m}m ago` : m < 1440 ? `${Math.round(m / 60)}h ago` : `${Math.round(m / 1440)}d ago`; };
const pct = r => r == null ? '<span class="muted">—</span>' : (v => `<span class="${v >= 50 ? 'up' : v <= -33 ? 'down' : ''}">${v > 0 ? '+' : ''}${v}%</span>`)(Math.round((r - 1) * 100));
const chg = v => v == null ? '' : `<span class="${v > 0 ? 'up' : v < 0 ? 'down' : ''}">${v > 0 ? '+' : ''}${v.toFixed(2)}%</span>`;
const num = (v, d = 2) => v == null ? '—' : Number(v).toLocaleString('en-US', { maximumFractionDigits: d });
const spark = (vals, color = '#3fb6ff') => { if (!vals || vals.length < 2) return ''; const max = Math.max(...vals, 1e-9), min = Math.min(...vals), W = 80, H = 22;
  const pts = vals.map((v, i) => `${(i * W / (vals.length - 1)).toFixed(1)},${(H - 2 - (H - 4) * (v - min) / ((max - min) || 1)).toFixed(1)}`).join(' ');
  return `<svg width="${W}" height="${H}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5"/></svg>`; };
const score = t => Math.max(t.newsRatio || 0, t.attRatio || 0);
let D = null;

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + b.dataset.v));
  try { localStorage.setItem('cc_tab', b.dataset.v); } catch {}
  window.scrollTo(0, 0);
});

function radarRows(topics, limit) {
  return [...topics].sort((a, b) => score(b) - score(a)).slice(0, limit).map((t, i) => `
    <div class="row topic" data-i="${i}">
      <div><div class="t">${esc(t.topic)} ${t.spike ? '<span class="flag">▲ SPIKE</span>' : ''}</div>
        <div class="s">News share ${t.newsNow != null ? t.newsNow + '%' : 'n/a'} ${pct(t.newsRatio)}${t.newsStale ? ' · older data' : ''} · Wiki ${t.attNow != null ? num(t.attNow, 0) + '/day' : 'n/a'} ${pct(t.attRatio)}</div></div>
      <div class="r">${spark(t.newsSpark)}<br>${spark(t.attSpark, '#c58cff')}</div>
    </div>
    <div class="heads">${(t.headlines || []).map(h => `<a class="item" href="${esc(h.url)}" target="_blank" rel="noopener">${esc(h.title)}<small>${esc(h.source)} · ${ago(h.date)}</small></a>`).join('') || '<div class="muted">No headlines</div>'}
      ${t.articleUrl ? `<a class="item" href="${esc(t.articleUrl)}" target="_blank" rel="noopener"><small>Wikipedia: ${esc(t.article)}</small></a>` : ''}</div>`).join('');
}
function bindTopics(root) { root.querySelectorAll('.topic').forEach(r => r.onclick = () => r.nextElementSibling.classList.toggle('open')); }
const tiles = ms => `<div class="grid">${ms.map(m => `<div class="tile"><div class="n">${esc(m.name)}${m.stale ? ' ·old' : ''}</div><div class="v">${num(m.price)}</div><div class="c">${chg(m.changePct)}</div></div>`).join('')}</div>`;
const newsList = (items, n) => (items || []).slice(0, n).map(i => `<a class="item" href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}<small>${esc(i.source)} · ${ago(i.date)}</small></a>`).join('');

function render() {
  const d = D; if (!d) return;
  $('upd').innerHTML = `Updated ${ago(d.generatedAt)}<br><span style="opacity:.7">auto-refreshes every 30 min</span>`;
  const topics = d.topics || [], spikes = topics.filter(t => t.spike);
  const keyMk = (d.markets || []).filter(m => ['^GSPC', '^IXIC', '^VIX', 'CL=F', 'GC=F', 'BTC-USD'].includes(m.symbol));
  const bigQ = (d.quakes || []).filter(q => q.mag >= 6);
  $('v-overview').innerHTML = `
    <a class="cta" href="${esc(d.debriefUrl)}" target="_blank" rel="noopener">Read the latest AI debrief →</a>
    ${spikes.length ? `<div class="card"><h3>▲ Spiking now</h3>${radarRows(spikes, 5)}</div>` : ''}
    <div class="card"><h3>Markets</h3>${tiles(keyMk)}</div>
    <div class="card"><h3>Spike Radar · top movers</h3>${radarRows(topics, 4)}<div class="muted" style="margin-top:6px">Tap a topic for headlines. Blue = share of world news, purple = Wikipedia views.</div></div>
    <div class="card"><h3>Latest world news</h3>${newsList(d.world, 8)}</div>
    ${bigQ.length ? `<div class="card"><h3>Major earthquakes (24h)</h3>${bigQ.map(q => `<a class="item" href="${esc(q.url)}" target="_blank" rel="noopener">M${q.mag} — ${esc(q.place)}<small>${ago(q.time)}${q.tsunami ? ' · tsunami flag' : ''}</small></a>`).join('')}</div>` : ''}`;
  $('v-radar').innerHTML = `<div class="card"><h3>Spike Radar · last 2 days vs 30-day median</h3>${radarRows(topics, 50)}</div>
    <div class="card muted">News share = the topic's percent of all world news (GDELT). Wiki = daily views of its Wikipedia article. A big gap between the two means media is pushing a story harder than people are looking, or the reverse. ▲ = either doubled. Edit the topics in <b>watchlist.json</b> in the repo.</div>`;
  $('v-world').innerHTML = `<div class="card"><h3>World news · BBC, Al Jazeera, France 24, DW, NPR</h3>${newsList(d.world, 40)}</div>`;
  $('v-markets').innerHTML = `<div class="card"><h3>Markets · day change</h3>${tiles(d.markets || [])}</div><div class="muted">Prices from Yahoo Finance, delayed. Refreshed every 30 minutes.</div>`;
  $('v-earth').innerHTML = `<div class="card"><h3>Earthquakes M4.5+ · last 24h (USGS)</h3>${(d.quakes || []).map(q => `<a class="item" href="${esc(q.url)}" target="_blank" rel="noopener">M${q.mag} — ${esc(q.place)}<small>${ago(q.time)}${q.tsunami ? ' · tsunami flag' : ''}</small></a>`).join('') || '<div class="muted">None</div>'}</div>
    <div class="card"><h3>Active natural hazards (NASA EONET, 7 days)</h3>${(d.hazards || []).map(h => `<div class="row"><div><div class="t">${esc(h.title)}</div><div class="s">${esc(h.category || '')}</div></div><div class="r muted">${ago(h.date)}</div></div>`).join('') || '<div class="muted">None</div>'}</div>`;
  ['v-overview', 'v-radar'].forEach(id => bindTopics($(id)));
}

async function load() {
  try { const r = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' }); if (!r.ok) throw new Error(r.status); D = await r.json(); render(); }
  catch (e) { if (!D) $('v-overview').innerHTML = `<div class="card">Couldn't load data yet (${esc(e.message)}). It appears after the first build runs.</div>`; }
}
try { const t = localStorage.getItem('cc_tab'); if (t) document.querySelector(`nav button[data-v="${t}"]`)?.click(); } catch {}
load(); setInterval(load, 5 * 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
</body>
</html>
